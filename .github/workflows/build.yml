name: Build installers

# Builds the installers for macOS, Windows and Linux.
#   • Push a tag like v0.1.0  → installers are attached to a draft GitHub Release.
#   • Run it by hand (Actions → Build installers → Run workflow) → installers
#     are available as downloadable artifacts on the run page.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # lets a tagged build create the draft release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-latest }
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # Launch the real app on this operating system and record with it.
      # (Uses Chromium's built-in fake camera, microphone and screen, so it
      # needs no hardware and no OS permissions.)
      - name: Install a virtual desktop (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox xcompmgr xdotool
          npx playwright-core install chromium
      - name: Smoke test on ${{ matrix.name }}
        id: smoke
        continue-on-error: ${{ runner.os != 'Linux' }}
        run: npm run test:e2e
        env:
          E2E_OWN_DISPLAY: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.name }}
          path: test-results/
          retention-days: 7

      - name: Build (macOS, Apple silicon)
        if: runner.os == 'macOS'
        run: |
          file node_modules/ffmpeg-static/ffmpeg | tee /dev/stderr | grep -q arm64
          npx electron-builder --mac --arm64 --publish ${{ env.PUBLISH }}
      - name: Build (macOS, Intel)
        if: runner.os == 'macOS'
        run: |
          # Swap in the Intel ffmpeg before packaging the Intel app. The
          # installer skips the download when a binary is already there, so
          # the Apple-silicon one has to be removed first.
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js
          file node_modules/ffmpeg-static/ffmpeg | tee /dev/stderr | grep -q x86_64
          npx electron-builder --mac --x64 --publish ${{ env.PUBLISH }}
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish ${{ env.PUBLISH }}
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --x64 --publish ${{ env.PUBLISH }}

      - uses: actions/upload-artifact@v4
        with:
          name: Freeloomz-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 30
