name: CI

# Fast checks on every push and pull request: types, unit tests, and
# end-to-end tests that launch the real app and make real recordings.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Install a virtual desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox xcompmgr xdotool
          npx playwright-core install chromium
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_OWN_DISPLAY: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
