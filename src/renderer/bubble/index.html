<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; media-src 'self' blob: mediastream:" />
    <title>Freeloomz camera</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="bubble.css" />
  </head>
  <body>
    <div class="bubble" id="bubble">
      <video id="video" autoplay muted playsinline></video>
      <div class="placeholder" id="placeholder" hidden>
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="9" r="4" /><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0" /></svg>
        <span id="placeholderText">No camera</span>
      </div>
      <div class="paused" id="paused" hidden>Paused</div>
      <div class="controls" id="controls">
        <button id="recordButton" class="rec" title="Start recording"><i></i></button>
        <button id="pauseButton" title="Pause" hidden>
          <svg class="icon" viewBox="0 0 24 24"><path id="pauseIcon" d="M8.5 5v14M15.5 5v14" /></svg>
        </button>
      </div>
    </div>
    <script type="module" src="bubble.js"></script>
  </body>
</html>
